# A throwaway sample script for the format. Real episodes live in episodes/<slug>/script.yml.
# See kit/SCRIPT.md for the full schema and tag grammar.

id: sample-episode
tone: balanced

beats:
  # --- SECTION: cold-open ---
  # Code-kit beats: text-hero and simple diagrams (exact text; no AI).
  - narration: |
      Cold open. A book about reality falling apart. We love it already.
    scene:
      layers:
        - component: bg:paper
        - component: text:hero
          props: { text: "REALITY", sub: "(results may vary)", color: red }
    tags: [HOLD]

  - narration: |
      Once, there was an office.
    scene:
      layers:
        - component: bg:office-wall
        - component: prop:desk
          props: { x: 600, y: 620, w: 720, h: 200 }
        - component: prop:papers
          props: { x: 860, y: 628 }
      caption: "Once, there was an office."
    tags: [ZOOM]

  - narration: |
      Now it is a three p.m. sync.
    scene:
      layers:
        - component: bg:office-wall
        - component: prop:wall-clock
          props: { x: 960, y: 420 }
      caption: "Now it is... a 3 p.m. sync."
    tags: ["SFX:record-scratch"]

  # AI-still beats (npm run generate-scenes sample). Describe action, expression and setting;
  # a character's look comes from characters/<id>.yml (episode) or shared/characters/<id>.yml.
  - narration: |
      So he picked up a book. A thick one.
    scene:
      image: "a tired office clerk sits at a cluttered desk reading a thick paperback novel, eyebrows raised in disbelief; setting: a cozy small office with a round window"
      caption: "Self-improvement, office edition."
    tags: [ZOOM]

  - narration: |
      And in the book, there was a spray can that fixes reality.
    scene:
      image: "a single dusty aerosol spray can standing alone on an empty shelf, glowing faintly; setting: a run-down 1970s convenience store"
      caption: "Safe when used as directed."
