id: glen-runciter
name: Glen Runciter
description: >-
  Glen Runciter, a tall, massively built elderly businessman with a huge tomcat-like head, a wild
  mass of wiry gray hair, round alert eyes, a wrinkled wattled face and big wide hands, wearing a
  loud multicolored suit, a knit cummerbund and a cravat, holding a single green cigar.
short: >-
  Runciter, huge elderly man with a big head and wild wiry gray hair, loud multicolored suit and
  cravat, a single green cigar.
notes: >-
  Book: tall, elderly, big; massive tomcat-like head; gray wirelike hair; round protruding eyes;
  large hands; varicolored Dacron suit, knit cummerbund, cheesecloth cravat (ch. 1); green cigar
  and gold pocket watch (ch. 5).
