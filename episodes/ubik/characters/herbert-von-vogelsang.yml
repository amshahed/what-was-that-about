id: herbert-von-vogelsang
name: Herbert Schoenheit von Vogelsang
description: >-
  Herbert von Vogelsang, a short, pudgy human man, a sallow funeral director with a wide
  froggy mouth, glassy button eyes and soft pulpy hands, wearing a tweed toga, a crimson sash, loafers and a purple beanie
  with a small airplane propeller on top.
short: >-
  Von Vogelsang, short pudgy human funeral director with a wide froggy mouth, tweed toga, crimson sash, purple propeller
  beanie.
notes: >-
  Book: solemn and froglike (ch. 2); beetle-like, tweed toga, loafers, crimson sash, purple
  airplane-propeller beanie (ch. 7); pulpy hands, eyes like glass buttons (ch. 8). Height ours.
