id: joe-chip
name: Joe Chip
description: >-
  Joe Chip, a thin tired man in his thirties with messy brown hair, dark stubble and bags under his
  eyes, wearing a maroon wrapper coat, a felt cap with a dangling tassel and shoes with turned-up
  toes.
short: >-
  Joe Chip, thin tired man with stubble, maroon wrapper coat, tasseled felt cap, turned-up shoes.
notes: >-
  Book: maroon wrapper, turned-up "twinkle-toes" shoes, tasseled felt cap (ch. 3); haggard,
  hungover (ch. 4). Face, age, hair and stubble are ours — the book gives almost none.
